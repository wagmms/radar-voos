version: '3.8'

services:
  radar-voos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: radar-voos-engine
    restart: unless-stopped
    ports:
      - "3333:3333"
    environment:
      - PORT=3333
      - HOST=0.0.0.0
      - NODE_ENV=production
      - DB_PATH=/app/data/radar_voos.sqlite
    env_file:
      - .env
    volumes:
      - radar_voos_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3333/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  radar_voos_data:
    driver: local
