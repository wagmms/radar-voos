services:
  - type: web
    name: radar-voos-backend
    env: node
    plan: free
    region: ohio
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_OPTIONS
        value: "--experimental-sqlite"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SERPAPI_KEYS
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_POLLING
        value: "true"
      - key: GATILHO_QUEDA_RELAMPAGO_PCT
        value: "15"
      - key: SCAN_INTERVAL_MINUTES
        value: "60"
      - key: DB_PATH
        value: ./data/radar_voos.sqlite
