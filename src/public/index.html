<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Voos • Caçador de Tarifas & Bug Fares</title>
  <meta name="description" content="Monitoramento inteligente de voos, bug fares e economia real em passagens aéreas.">
  <meta name="theme-color" content="#0a0d14">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0d14;
      --card-bg: #121826;
      --surface-elevated: #1e293b;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-subtle: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.14);
      --inner-glow: inset 0 1px 0 0 rgba(255, 255, 255, 0.06);
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0ea5e9;
      --primary-glow: rgba(56, 189, 248, 0.12);
      --success: #10b981;
      --success-text: #34d399;
      --success-glow: rgba(16, 185, 129, 0.12);
      --warning: #f59e0b;
      --warning-text: #fbbf24;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --radius: 14px;
      --radius-sm: 8px;
      --radius-xs: 6px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.06) 0%, transparent 55%);
      color: var(--text);
      font-family: var(--font);
      font-feature-settings: 'tnum', 'cv02', 'cv03', 'cv04', 'cv11';
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      padding-bottom: 80px;
      min-height: 100vh;
    }

    .container {
      max-width: 1020px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      padding: 16px 0 24px;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 28px;
    }

    .app-title-group h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text);
    }

    .app-subtitle {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-top: 2px;
      font-weight: 400;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s cubic-bezier(0.16, 1, 0.3, 1);
      text-decoration: none;
      white-space: nowrap;
      user-select: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-sm {
      padding: 6px 11px;
      font-size: 0.78rem;
      border-radius: var(--radius-xs);
    }

    .btn-primary {
      background: linear-gradient(180deg, #38bdf8 0%, #0284c7 100%);
      color: #06101e;
      font-weight: 700;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 1px 2px rgba(0, 0, 0, 0.3);
    }
    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: var(--surface-elevated);
      color: var(--text);
      border-color: var(--card-border);
      box-shadow: var(--inner-glow);
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: #263349;
      border-color: var(--card-hover);
    }

    .btn-outline {
      background: rgba(255, 255, 255, 0.02);
      color: var(--text-secondary);
      border-color: var(--card-border);
    }
    .btn-outline:hover:not(:disabled) {
      border-color: var(--card-hover);
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: none;
    }
    .btn-ghost:hover:not(:disabled) {
      background-color: rgba(255, 255, 255, 0.05);
      color: var(--text);
    }

    .btn-danger {
      color: var(--text-muted);
    }
    .btn-danger:hover:not(:disabled) {
      background-color: rgba(239, 68, 68, 0.12);
      color: #f87171;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 360px;
    }

    .toast {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.82rem;
      font-weight: 500;
      background: var(--surface-elevated);
      color: var(--text);
      border: 1px solid var(--card-border);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5);
      animation: slideIn 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-success { border-left: 3px solid var(--success); }
    .toast-error { border-left: 3px solid var(--danger); }
    .toast-info { border-left: 3px solid var(--primary); }

    @keyframes slideIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Grid de Rotas */
    .rotas-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      align-items: stretch;
    }

    @media (min-width: 720px) {
      .rotas-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Card Rota — Aero Dark Mode */
    .rota-card {
      background: linear-gradient(180deg, rgba(24, 32, 50, 0.75) 0%, var(--card-bg) 100%);
      border: 1px solid var(--card-border);
      box-shadow: var(--inner-glow), 0 8px 24px -4px rgba(0, 0, 0, 0.35);
      border-radius: var(--radius);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .rota-card:hover {
      border-color: var(--card-hover);
      box-shadow: var(--inner-glow), 0 12px 30px -4px rgba(0, 0, 0, 0.5);
    }

    .rota-card-oportunidade {
      border-color: rgba(16, 185, 129, 0.28);
    }

    /* Header do Card */
    .rota-card-header {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rota-trajeto {
      display: flex;
      flex-direction: column;
      gap: 2px;
      min-width: 0;
    }

    .rota-trajeto h3 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.015em;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      line-height: 1.3;
    }

    .rota-seta {
      color: var(--primary);
      font-size: 0.85rem;
      opacity: 0.9;
    }

    .rota-periodo {
      font-size: 0.76rem;
      color: var(--text-muted);
      font-weight: 500;
      font-variant-numeric: tabular-nums;
    }

    .rota-badges-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .rota-badges-top:empty {
      display: none;
    }

    /* Sistema de Badges (Pílulas Translúcidas) */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 9px;
      border-radius: 9999px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.01em;
      line-height: 1.3;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      backdrop-filter: blur(6px);
    }

    .badge-meta {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-secondary);
      border: 1px solid var(--card-border);
    }

    .badge-meta-batida {
      background: var(--success-glow);
      color: var(--success-text);
      border: 1px solid rgba(16, 185, 129, 0.28);
      font-weight: 600;
    }

    .badge-filtro {
      background: rgba(56, 189, 248, 0.08);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.18);
    }

    .badge-silenciada {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning-text);
      border: 1px solid rgba(245, 158, 11, 0.22);
    }

    /* Termômetro e Janela Flexível */
    .badge-termometro {
      font-weight: 600;
    }
    .badge-termometro-baixo {
      background: rgba(16, 185, 129, 0.1);
      color: var(--success-text);
      border: 1px solid rgba(16, 185, 129, 0.24);
    }
    .badge-termometro-tipico {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning-text);
      border: 1px solid rgba(245, 158, 11, 0.24);
    }
    .badge-termometro-alto {
      background: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.24);
    }
    .badge-janela-flex {
      background: rgba(56, 189, 248, 0.08);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    /* Bloco de Preço Principal — Imponente e Sem Quebra */
    .rota-preco-bloco {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 12px;
      padding: 12px 14px;
      background: rgba(10, 13, 20, 0.55);
      border: 1px solid var(--card-border-subtle);
      border-radius: var(--radius-sm);
    }

    .preco-principal {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }

    .preco-valor {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.1;
      color: #ffffff;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "tnum";
    }

    .preco-menor {
      font-size: 0.73rem;
      font-weight: 500;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border-subtle);
      padding: 2px 7px;
      border-radius: var(--radius-xs);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .termometro-tag {
      font-size: 0.74rem;
      font-weight: 500;
      color: var(--text-muted);
      line-height: 1.3;
    }

    /* Container de Filtros Ativos */
    .rota-filtros-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    /* Horários e Metadados do Voo */
    .card-horarios {
      font-size: 0.78rem;
      color: var(--text-secondary);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(30, 41, 59, 0.35);
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border-subtle);
      font-variant-numeric: tabular-nums;
    }

    .horario-icon {
      font-size: 0.8rem;
      opacity: 0.85;
    }

    .horario-texto {
      font-weight: 600;
      color: var(--text);
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .badge-dias-extras {
      font-size: 0.66rem;
      font-weight: 700;
      color: var(--warning-text);
      background: rgba(245, 158, 11, 0.14);
      border: 1px solid rgba(245, 158, 11, 0.25);
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 2px;
    }

    .voo-tag {
      font-weight: 600;
      color: var(--primary);
    }

    .aeronave-tag {
      color: var(--text-muted);
      font-size: 0.74rem;
    }

    .conexao-tag {
      color: var(--warning-text);
      font-size: 0.74rem;
      font-weight: 500;
    }

    /* Micro-card: Trade-off (Opção Direta/Rápida) */
    .card-tradeoff {
      padding: 9px 12px;
      background: rgba(56, 189, 248, 0.05);
      border: 1px solid rgba(56, 189, 248, 0.18);
      border-radius: var(--radius-sm);
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
    }

    .tradeoff-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
      gap: 8px;
    }

    .tradeoff-badge {
      font-weight: 600;
      color: #7dd3fc;
    }

    .tradeoff-preco {
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .tradeoff-detalhes {
      color: var(--text-muted);
      font-size: 0.73rem;
    }

    .tradeoff-detalhes strong {
      color: var(--text-secondary);
    }

    /* Micro-card: Callout Melhor Data Alternativa */
    .card-data-alternativa {
      background: rgba(16, 185, 129, 0.06);
      border: 1px solid rgba(16, 185, 129, 0.2);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
    }

    .data-alternativa-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      gap: 8px;
    }

    .data-alternativa-tag {
      font-weight: 600;
      color: var(--success-text);
    }

    .data-alternativa-economia {
      font-weight: 700;
      color: var(--success-text);
      background: rgba(16, 185, 129, 0.12);
      padding: 1px 6px;
      border-radius: 4px;
      white-space: nowrap;
    }

    .data-alternativa-corpo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      color: var(--text-secondary);
      font-size: 0.75rem;
      gap: 6px;
    }

    .link-data-alternativa {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.73rem;
      white-space: nowrap;
    }
    .link-data-alternativa:hover {
      text-decoration: underline;
    }

    /* Micro-card: Ranking Regional Multi-Hub */
    .card-ranking-regional {
      background: rgba(15, 23, 42, 0.5);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-size: 0.76rem;
      font-variant-numeric: tabular-nums;
    }

    .ranking-regional-destaque {
      display: flex;
      align-items: center;
      gap: 6px;
      padding-bottom: 8px;
      margin-bottom: 8px;
      border-bottom: 1px solid var(--card-border-subtle);
      color: var(--text-secondary);
      font-size: 0.75rem;
    }

    .ranking-regional-destaque strong {
      color: var(--text);
    }

    .ranking-regional-lista {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .ranking-regional-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 4px 6px;
      border-radius: var(--radius-xs);
      color: var(--text-muted);
      font-size: 0.74rem;
    }

    .ranking-regional-item.ranking-vencedor {
      background: rgba(16, 185, 129, 0.08);
      color: var(--text);
      font-weight: 600;
    }

    .ranking-pos {
      font-weight: 700;
      color: var(--text-muted);
      min-width: 20px;
    }

    .ranking-vencedor .ranking-pos {
      color: var(--success-text);
    }

    .ranking-nome {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ranking-preco {
      font-weight: 700;
      color: var(--text);
      white-space: nowrap;
    }

    .ranking-vencedor .ranking-preco {
      color: var(--success-text);
    }

    .link-ranking-item {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(56, 189, 248, 0.08);
      white-space: nowrap;
    }
    .link-ranking-item:hover {
      background: rgba(56, 189, 248, 0.16);
    }

    /* Gráfico Calendário SVG */
    .grafico-calendario-container {
      background: rgba(10, 13, 20, 0.45);
      border: 1px solid var(--card-border-subtle);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-variant-numeric: tabular-nums;
    }

    .grafico-calendario-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .grafico-calendario-header strong {
      color: var(--success-text);
    }

    .grafico-calendario-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .rota-custo-destino {
      font-size: 0.74rem;
      color: var(--text-muted);
      padding: 4px 2px 0;
    }

    /* Rodapé de Ações do Card */
    .rota-card-actions {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid var(--card-border-subtle);
    }

    .rota-card-actions .btn-primary {
      flex: 1 1 auto;
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(6, 9, 15, 0.8);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 900;
      padding: 16px;
    }

    .modal-backdrop.hidden {
      display: none;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      box-shadow: var(--inner-glow), 0 24px 48px rgba(0, 0, 0, 0.65);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      padding: 22px;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .modal-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.015em;
    }

    /* Forms */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.88rem;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.12);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 0.82rem;
      color: var(--text-secondary);
    }

    .form-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .tipo-viagem-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--bg);
      padding: 4px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
    }

    .radio-tab {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease;
      border: 1px solid transparent;
    }

    .radio-tab input[type="radio"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .radio-tab:has(input:checked),
    .radio-tab.active {
      background: rgba(56, 189, 248, 0.12);
      color: var(--primary);
      border-color: rgba(56, 189, 248, 0.3);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
    }

    /* Empty & Loading */
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      color: var(--text-muted);
    }

    .empty-state h3 {
      font-size: 1.05rem;
      color: var(--text);
      margin-bottom: 6px;
    }

    .loading-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="app-title-group">
        <h1>✈️ Radar de Voos</h1>
        <p class="app-subtitle">Caçador proativo de tarifas &amp; economia em R$</p>
      </div>
      <div class="header-actions">
        <button id="btn-varrer-todas" class="btn btn-secondary btn-sm" title="Varrer e checar preços de todos os voos monitorados agora">
          ⚡ Varrer Todos os Voos
        </button>
        <button id="btn-nova-rota" class="btn btn-primary btn-sm">
          ➕ Nova Rota
        </button>
      </div>
    </header>

    <main id="rotas-container" class="rotas-grid">
      <!-- Cards de rotas renderizados via JavaScript -->
      <div class="empty-state" style="grid-column: 1 / -1;">
        <div class="loading-spinner"></div>
        <p style="margin-top: 12px;">Carregando rotas monitoradas...</p>
      </div>
    </main>
  </div>

  <!-- Modal Criação / Edição de Rota -->
  <div id="modal-rota" class="modal-backdrop hidden">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="modal-titulo">Nova Rota Monitorada</h2>
        <button type="button" id="btn-fechar-modal" class="btn btn-ghost btn-sm">✕</button>
      </header>

      <form id="form-rota">
        <input type="hidden" id="rota-id">

        <div class="form-row">
          <div class="form-group">
            <label for="campo-origem">Origem *</label>
            <input type="text" id="campo-origem" class="form-control" placeholder="Ex: SAO ou São Paulo" required>
          </div>
          <div class="form-group">
            <label for="campo-destino">Destino *</label>
            <input type="text" id="campo-destino" class="form-control" placeholder="Ex: LIS ou Lisboa" required>
          </div>
        </div>

        <div class="form-group">
          <label>Tipo de Viagem *</label>
          <div class="tipo-viagem-toggle" role="radiogroup" aria-label="Tipo de Viagem">
            <label class="radio-tab active" id="label-tipo-ida-volta">
              <input type="radio" name="tipo_viagem" id="tipo-ida-volta" value="round_trip" checked>
              <span>🔄 Ida e Volta</span>
            </label>
            <label class="radio-tab" id="label-tipo-so-ida">
              <input type="radio" name="tipo_viagem" id="tipo-so-ida" value="one_way">
              <span>➡️ Apenas Ida</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" id="campo-sem-data">
            <span>🗓️ Modo Flexível Sem Data (menor preço nos próximos meses)</span>
          </label>
        </div>

        <div id="datas-container" class="form-row">
          <div class="form-group" id="grupo-data-ida">
            <label for="campo-data-ida">Data de Ida *</label>
            <input type="date" id="campo-data-ida" class="form-control">
          </div>
          <div class="form-group" id="grupo-data-volta">
            <label for="campo-data-volta">Data de Volta (ou dias)</label>
            <input type="text" id="campo-data-volta" class="form-control" placeholder="Ex: 2026-11-20 ou 10">
          </div>
        </div>

        <div class="form-group" id="grupo-dias-flexiveis">
          <label for="campo-dias-flexiveis">📅 Janela Flexível</label>
          <select id="campo-dias-flexiveis" class="form-control">
            <option value="0">Data exata</option>
            <option value="1">±1 dia</option>
            <option value="2">±2 dias</option>
            <option value="3">±3 dias</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="campo-preco-alvo">🎯 Meta/Teto de Preço em R$</label>
            <input type="number" id="campo-preco-alvo" class="form-control" placeholder="Ex: 3500" min="0" step="10">
          </div>
          <div class="form-group">
            <label for="campo-max-stops">Conexões / Paradas</label>
            <select id="campo-max-stops" class="form-control">
              <option value="">Qualquer número de escalas</option>
              <option value="0">✈️ Apenas voos diretos</option>
              <option value="1">1 Parada máxima</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" id="campo-carry-on-bags" value="1">
            <span>🧳 Exigir 1 mala de mão inclusa no filtro</span>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancelar" class="btn btn-outline">Cancelar</button>
          <button type="submit" id="btn-salvar" class="btn btn-primary">
            <span class="btn-text">Salvar Rota</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
