<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Radar de Voos • Caçador de Tarifas & Bug Fares</title>
  <meta name="description" content="Monitoramento inteligente de voos, bug fares e economia real em passagens aéreas.">
  <meta name="theme-color" content="#0b0f17">
  <link rel="manifest" href="/manifest.json">
  <style>
    :root {
      --bg: #0b0f17;
      --card-bg: #131926;
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.12);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --primary-glow: rgba(56, 189, 248, 0.15);
      --success: #10b981;
      --success-glow: rgba(16, 185, 129, 0.15);
      --warning: #f59e0b;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --radius: 12px;
      --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      padding-bottom: 80px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px;
    }

    /* Header */
    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 24px;
    }

    .app-title-group h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .app-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 10px 16px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #0b0f17;
    }
    .btn-primary:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: rgba(255, 255, 255, 0.08);
      color: var(--text);
      border-color: var(--card-border);
    }
    .btn-secondary:hover:not(:disabled) {
      background-color: rgba(255, 255, 255, 0.14);
    }

    .btn-outline {
      background: transparent;
      color: var(--text);
      border-color: var(--card-border);
    }
    .btn-outline:hover:not(:disabled) {
      border-color: var(--card-hover);
      background-color: rgba(255, 255, 255, 0.04);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: none;
    }
    .btn-ghost:hover:not(:disabled) {
      color: var(--text);
    }

    .btn-danger {
      color: var(--danger);
    }
    .btn-danger:hover:not(:disabled) {
      background-color: rgba(239, 68, 68, 0.1);
      color: #fca5a5;
    }

    /* Toast */
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-width: 360px;
    }

    .toast {
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      background: #1e293b;
      color: var(--text);
      border: 1px solid var(--card-border);
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      animation: slideIn 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast-success { border-color: var(--success); }
    .toast-error { border-color: var(--danger); }
    .toast-info { border-color: var(--primary); }

    @keyframes slideIn {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Grid de Rotas */
    .rotas-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 680px) {
      .rotas-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* Card Rota */
    .rota-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }

    .rota-card:hover {
      border-color: var(--card-hover);
    }

    .rota-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
    }

    .rota-trajeto h3 {
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .rota-seta {
      color: var(--primary);
      font-size: 0.9rem;
    }

    .rota-periodo {
      font-size: 0.78rem;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    .rota-badges-top {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.01em;
    }

    .badge-meta {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    .badge-meta-batida {
      background: var(--success-glow);
      color: var(--success);
      border-color: rgba(16, 185, 129, 0.3);
      font-weight: 700;
    }

    .badge-filtro {
      background: rgba(56, 189, 248, 0.1);
      color: var(--primary);
      border: 1px solid rgba(56, 189, 248, 0.2);
    }

    .badge-silenciada {
      background: rgba(245, 158, 11, 0.1);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.25);
    }

    /* Preço Bloco */
    .rota-preco-bloco {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 8px 12px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: var(--radius-sm);
    }

    .preco-principal {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .preco-valor {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
    }

    .preco-menor {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .termometro-tag {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    /* Horários */
    .card-horarios {
      font-size: 0.8rem;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: var(--radius-sm);
      border: 1px solid var(--card-border);
    }

    .voo-tag {
      font-weight: 600;
      color: var(--primary);
    }

    .conexao-tag {
      color: var(--warning);
      font-size: 0.75rem;
    }

    /* Trade-off */
    .card-tradeoff {
      padding: 8px 10px;
      background: rgba(56, 189, 248, 0.04);
      border: 1px dashed rgba(56, 189, 248, 0.25);
      border-radius: var(--radius-sm);
      font-size: 0.78rem;
    }

    .tradeoff-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2px;
    }

    .tradeoff-badge {
      font-weight: 700;
      color: var(--primary);
    }

    .tradeoff-preco {
      font-weight: 800;
      color: #fff;
    }

    .tradeoff-detalhes {
      color: var(--text-muted);
    }

    .rota-custo-destino {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* Termômetro e Janela Flexível */
    .badge-termometro {
      font-weight: 600;
    }
    .badge-termometro-baixo {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge-termometro-tipico {
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .badge-termometro-alto {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .badge-janela-flex {
      background: rgba(56, 189, 248, 0.12);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    /* Callout Melhor Data Alternativa */
    .card-data-alternativa {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      font-size: 0.8rem;
    }
    .data-alternativa-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }
    .data-alternativa-tag {
      font-weight: 700;
      color: #34d399;
    }
    .data-alternativa-economia {
      font-weight: 800;
      color: #10b981;
    }
    .data-alternativa-corpo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      font-size: 0.78rem;
      gap: 6px;
    }
    .link-data-alternativa {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.75rem;
    }
    .link-data-alternativa:hover {
      text-decoration: underline;
    }

    /* Gráfico Calendário SVG */
    .grafico-calendario-container {
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
    }
    .grafico-calendario-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    .grafico-calendario-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    /* Actions */
    .rota-card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: auto;
      padding-top: 8px;
      border-top: 1px solid var(--card-border);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 900;
      padding: 16px;
    }

    .modal-backdrop.hidden {
      display: none;
    }

    .modal-content {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    /* Forms */
    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      background: #0b0f17;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      color: var(--text);
      font-family: inherit;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s ease;
    }

    .form-control:focus {
      border-color: var(--primary);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-check {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      user-select: none;
      font-size: 0.85rem;
    }

    .form-check input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 20px;
      padding-top: 14px;
      border-top: 1px solid var(--card-border);
    }

    /* Empty & Loading */
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      background: var(--card-bg);
      border: 1px dashed var(--card-border);
      border-radius: var(--radius);
      color: var(--text-muted);
    }

    .empty-state h3 {
      font-size: 1.1rem;
      color: var(--text);
      margin-bottom: 6px;
    }

    .loading-spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      border-top-color: var(--primary);
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="app-header">
      <div class="app-title-group">
        <h1>✈️ Radar de Voos</h1>
        <p class="app-subtitle">Caçador proativo de tarifas & economia em R$</p>
      </div>
      <div class="header-actions">
        <button id="btn-sync" class="btn btn-secondary btn-sm" title="Recarregar rotas">
          🔄 Atualizar
        </button>
        <button id="btn-nova-rota" class="btn btn-primary btn-sm">
          ➕ Nova Rota
        </button>
      </div>
    </header>

    <main id="rotas-container" class="rotas-grid">
      <!-- Cards de rotas renderizados via JavaScript -->
      <div class="empty-state" style="grid-column: 1 / -1;">
        <div class="loading-spinner"></div>
        <p style="margin-top: 12px;">Carregando rotas monitoradas...</p>
      </div>
    </main>
  </div>

  <!-- Modal Criação / Edição de Rota -->
  <div id="modal-rota" class="modal-backdrop hidden">
    <div class="modal-content">
      <header class="modal-header">
        <h2 id="modal-titulo">Nova Rota Monitorada</h2>
        <button type="button" id="btn-fechar-modal" class="btn btn-ghost btn-sm">✕</button>
      </header>

      <form id="form-rota">
        <input type="hidden" id="rota-id">

        <div class="form-row">
          <div class="form-group">
            <label for="campo-origem">Origem *</label>
            <input type="text" id="campo-origem" class="form-control" placeholder="Ex: SAO ou São Paulo" required>
          </div>
          <div class="form-group">
            <label for="campo-destino">Destino *</label>
            <input type="text" id="campo-destino" class="form-control" placeholder="Ex: LIS ou Lisboa" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" id="campo-sem-data">
            <span>🗓️ Modo Flexível Sem Data (menor preço nos próximos meses)</span>
          </label>
        </div>

        <div id="datas-container" class="form-row">
          <div class="form-group">
            <label for="campo-data-ida">Data de Ida *</label>
            <input type="date" id="campo-data-ida" class="form-control">
          </div>
          <div class="form-group">
            <label for="campo-data-volta">Data de Volta (ou dias)</label>
            <input type="text" id="campo-data-volta" class="form-control" placeholder="Ex: 2026-11-20 ou 10">
          </div>
        </div>

        <div class="form-group" id="grupo-dias-flexiveis">
          <label for="campo-dias-flexiveis">📅 Janela Flexível</label>
          <select id="campo-dias-flexiveis" class="form-control">
            <option value="0">Data exata</option>
            <option value="1">±1 dia</option>
            <option value="2">±2 dias</option>
            <option value="3">±3 dias</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="campo-preco-alvo">🎯 Meta/Teto de Preço em R$</label>
            <input type="number" id="campo-preco-alvo" class="form-control" placeholder="Ex: 3500" min="0" step="10">
          </div>
          <div class="form-group">
            <label for="campo-max-stops">Conexões / Paradas</label>
            <select id="campo-max-stops" class="form-control">
              <option value="">Qualquer número de escalas</option>
              <option value="0">✈️ Apenas voos diretos</option>
              <option value="1">1 Parada máxima</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label class="form-check">
            <input type="checkbox" id="campo-carry-on-bags" value="1">
            <span>🧳 Exigir 1 mala de mão inclusa no filtro</span>
          </label>
        </div>

        <div class="modal-actions">
          <button type="button" id="btn-cancelar" class="btn btn-outline">Cancelar</button>
          <button type="submit" id="btn-salvar" class="btn btn-primary">
            <span class="btn-text">Salvar Rota</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container"></div>

  <script type="module" src="/app.js"></script>
</body>
</html>
